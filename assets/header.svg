<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Hi, I'm Dayanand Kori">
  <style>
    .title { fill: #1e3a8a; }
    .sub { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .sub { fill: #9198a1; }
    }
  </style>

  <!-- back wave, drifts left -->
  <path fill="#6366f1" fill-opacity="0.22"
        d="M0 175 Q125 139 250 175 T500 175 T750 175 T1000 175 T1250 175 T1500 175 T1750 175 T2000 175 V240 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- front wave, drifts right -->
  <path fill="#38bdf8" fill-opacity="0.35"
        d="M0 200 Q125 168 250 200 T500 200 T750 200 T1000 200 T1250 200 T1500 200 T1750 200 T2000 200 V240 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <text class="title" x="500" y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" opacity="0">
    Hi, I'm Dayanand Kori
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <text class="sub" x="500" y="148" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" opacity="0">
    Backend engineering  |  Applied AI  |  Healthcare tech
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
